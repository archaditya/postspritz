<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0f17; color: #f3f4f6; margin: 0; padding: 40px 20px; }
    .container { max-width: 580px; margin: 0 auto; background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 36px; }
    .logo { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 24px; }
    .logo span { color: #FF5A1F; }
    h1 { font-size: 20px; color: #ffffff; margin-bottom: 16px; }
    p { font-size: 15px; line-height: 1.6; color: #9ca3af; margin-bottom: 24px; }
    .post-box { background-color: #1f2937; border-radius: 8px; padding: 16px; font-size: 14px; color: #e5e7eb; margin-bottom: 24px; }
    .btn { display: inline-block; background-color: #10b981; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 15px; }
    .footer { margin-top: 32px; font-size: 12px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Post<span>Spritz</span></div>
    <h1>Your post is live! 🎉</h1>
    <p>Your scheduled post was successfully published to your target social channels.</p>
    <div class="post-box">{{postSnippet}}</div>
    <a href="{{postUrl}}" class="btn">View Post & Analytics</a>
    <div class="footer">© 2026 PostSpritz. Create once. Spritz everywhere.</div>
  </div>
</body>
</html>
