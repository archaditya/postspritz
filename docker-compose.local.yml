services:
  postgres:
    image: postgres:16-alpine
    container_name: postspritz_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postspritz
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postspritz
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postspritz -d postspritz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: postspritz_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: postspritz_api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postspritz:password@postgres:5432/postspritz
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://api:4000
      - WEB_BASE_URL=http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared-types:/app/packages/shared-types
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: postspritz_web
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - INTERNAL_API_URL=http://api:4000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared-types:/app/packages/shared-types
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
